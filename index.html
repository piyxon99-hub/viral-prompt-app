<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Findora App</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <!-- Views -->
        <div id="home-view" class="view active">
        <!-- Header -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="24" height="28" viewBox="0 0 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="0" y="0" width="8" height="28" rx="4" fill="#4b7bec"/>
                        <rect x="10" y="0" width="14" height="8" rx="4" fill="#769bf4"/>
                        <rect x="10" y="12" width="10" height="8" rx="4" fill="#a4bdfc"/>
                    </svg>
                </div>
                <h1>Findora</h1>
            </div>
            <div class="profile-pic">
                <img src="https://i.pravatar.cc/150?img=47" alt="Profile Picture">
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <div class="search-box">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search...">
                <i class="ph ph-faders filter-icon"></i>
            </div>
        </div>

        <!-- Explore Section -->
        <section class="explore-section">
            <div class="section-header">
                <h2>Explore</h2>
                <a href="#" class="see-all">See all</a>
            </div>
            <div class="explore-cards">
                <!-- Education Card -->
                <div class="card explore-card" style="background-color: #f2f7fb;">
                    <div class="icon-container">
                         <i class="ph-fill ph-book-open" style="font-size: 64px; color: #4b7bec;"></i>
                    </div>
                    <h3>Education</h3>
                    <p>Learn & grow</p>
                </div>
                <!-- Health Card -->
                <div class="card explore-card" style="background-color: #f0fbf6;">
                    <div class="icon-container">
                        <i class="ph-fill ph-heartbeat" style="font-size: 64px; color: #20bf6b;"></i>
                    </div>
                    <h3>Health</h3>
                    <p>Stay healthy</p>
                </div>
                <!-- Shopping Card -->
                <div class="card explore-card" style="background-color: #f7f3ff;">
                    <div class="icon-container">
                        <i class="ph-fill ph-shopping-bag" style="font-size: 64px; color: #a55eea;"></i>
                    </div>
                    <h3>Shopping</h3>
                    <p>Shop smarter</p>
                </div>
                <!-- Tech Card -->
                <div class="card explore-card extra-card" style="display: none; background-color: #f0f4ff;">
                    <div class="icon-container">
                        <i class="ph-fill ph-desktop" style="font-size: 64px; color: #4834d4;"></i>
                    </div>
                    <h3>Tech</h3>
                    <p>Gadgets & gear</p>
                </div>
                <!-- Sports Card -->
                <div class="card explore-card extra-card" style="display: none; background-color: #fff0f0;">
                    <div class="icon-container">
                        <i class="ph-fill ph-basketball" style="font-size: 64px; color: #eb4d4b;"></i>
                    </div>
                    <h3>Sports</h3>
                    <p>Stay active</p>
                </div>
                <!-- Art Card -->
                <div class="card explore-card extra-card" style="display: none; background-color: #fef4e8;">
                    <div class="icon-container">
                        <i class="ph-fill ph-palette" style="font-size: 64px; color: #f0932b;"></i>
                    </div>
                    <h3>Art</h3>
                    <p>Get creative</p>
                </div>
            </div>
        </section>

        <!-- Choose Categories Section -->
        <section class="categories-section">
            <h2>Choose Categories</h2>
            <div class="categories-grid">
                <!-- Business -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #edf2fb; color: #4b7bec;">
                        <i class="ph ph-briefcase"></i>
                    </div>
                    <span class="cat-title">Business</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
                <!-- Food -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #fff4ed; color: #fa8231;">
                        <i class="ph ph-fork-knife"></i>
                    </div>
                    <span class="cat-title">Food</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
                <!-- Nature -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #ebfcf4; color: #20bf6b;">
                        <i class="ph ph-leaf"></i>
                    </div>
                    <span class="cat-title">Nature</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
                <!-- Travel -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #f4efff; color: #a55eea;">
                        <i class="ph ph-airplane-tilt"></i>
                    </div>
                    <span class="cat-title">Travel</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
                <!-- Entertainment -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #ffeff3; color: #eb3b5a;">
                        <i class="ph ph-music-notes"></i>
                    </div>
                    <span class="cat-title">Entertainment</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
                <!-- Lifestyle -->
                <div class="card category-card">
                    <div class="cat-icon-container" style="background-color: #fff9e6; color: #f7b731;">
                        <i class="ph ph-graduation-cap"></i>
                    </div>
                    <span class="cat-title">Lifestyle</span>
                    <i class="ph ph-caret-right cat-arrow"></i>
                </div>
            </div>
        </section>
        </div> <!-- End home-view -->

        <!-- Gallery View -->
        <div id="gallery-view" class="view" style="display: none;">
            <header class="header">
                <div class="logo-area">
                    <h1>Gallery</h1>
                </div>
            </header>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="img/gallery_landscape_1777541604836.png" alt="Landscape"></div>
                <div class="gallery-item"><img src="img/gallery_architecture_1777541623995.png" alt="Architecture"></div>
                <div class="gallery-item"><img src="img/gallery_abstract_1777541641953.png" alt="Abstract"></div>
                <div class="gallery-item"><img src="img/gallery_minimalist_1777541658335.png" alt="Minimalist"></div>
            </div>
        </div>
        
        <!-- Padding block to prevent bottom nav overlap -->
        <div style="height: 100px;"></div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-target="home-view">
                <i class="ph-fill ph-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item">
                <i class="ph ph-file-text"></i>
                <span>Notes</span>
            </a>
            <div class="nav-fab-container">
                <button class="fab">
                    <i class="ph ph-plus"></i>
                </button>
            </div>
            <a href="#" class="nav-item">
                <i class="ph ph-wallet"></i>
                <span>Finance</span>
            </a>
            <a href="#" class="nav-item" data-target="gallery-view">
                <i class="ph ph-image"></i>
                <span>Gallery</span>
            </a>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
